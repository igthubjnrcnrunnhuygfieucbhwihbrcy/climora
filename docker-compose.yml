services:
  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: climora
      POSTGRES_USER: climora
      POSTGRES_PASSWORD: climora
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U climora"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      CLIMORA_DATABASE_URL: postgresql+asyncpg://climora:climora@db:5432/climora
      CLIMORA_DATABASE_SYNC_URL: postgresql://climora:climora@db:5432/climora
      CLIMORA_REDIS_URL: redis://redis:6379/0
      CLIMORA_DEBUG: "false"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  collector:
    build:
      context: .
      dockerfile: Dockerfile
    command: python -m scripts.scheduler
    environment:
      CLIMORA_DATABASE_URL: postgresql+asyncpg://climora:climora@db:5432/climora
      CLIMORA_DATABASE_SYNC_URL: postgresql://climora:climora@db:5432/climora
      CLIMORA_REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
